<html>
    <head>
        <tite>
            loops in java script
        </tite>
    </head>
    <body>
        <p id="demo">

        </p>
        <script>
            var fruits=["apple","banana","mango","grapes"];
            var text="";
            var i;
            for(i=0;i<fruits.length;i++){
                text +=fruits[i]+"<br>";
            }
            document.getElementById("demo").innerHTML=text;
            
        </script>
    </body>
</html>
